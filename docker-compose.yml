version: '3.9'

services:
  api:
    build:
      context: ./Beyond.Backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TodoDb: Host=postgres;Database=TodoListDb;Username=applications;Password=trigger
      ConnectionStrings__Redis: redis:6379
    ports:
      - "5042:5042"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: applications
      POSTGRES_PASSWORD: trigger
      POSTGRES_DB: TodoListDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
