<h2 mat-dialog-title>Registrar progreso</h2>
<mat-dialog-content>
  <div class="subtitle">{{ data.todoTitle }}</div>
  <form [formGroup]="form" class="form">
    <mat-form-field appearance="outline">
      <mat-label>Fecha</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="date" required>
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Porcentaje</mat-label>
      <input type="number" matInput formControlName="percent" min="0" max="100" required>
      <span matSuffix>%</span>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button mat-dialog-close>Cancelar</button>
  <button mat-flat-button color="primary" (click)="submit()" [disabled]="form.invalid">Guardar</button>
</mat-dialog-actions>
